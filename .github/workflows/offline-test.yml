name: offline-test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  just-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v2

      - name: system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: markdown format check
        run: git ls-files '*.md' | xargs npx --yes prettier --check --log-level warn

      - name: embed model fixture
        run: just fetch-embed

      - name: playwright chromium
        run: uv run playwright install --with-deps chromium

      - name: offline regression matrix
        run: just test
