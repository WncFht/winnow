[project]
name = "winnow"
version = "0.1.0"
description = "Winnow（风选）— AI 早报产线：collect → filter → digest → produce"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2",
    "pyyaml>=6",
    "jsonschema>=4.20",
    "numpy>=1.26",
    "pillow",
    "playwright==1.63.0",
    "edge-tts>=7.2",
    "fonttools>=4.50",
    "rich>=13",
    "onnxruntime>=1.17",
    "tokenizers>=0.20",
    "urllib3>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stages", "adapters", "contracts"]
