# tts_dict.yaml — 口播发音词典（PLAN §7.5；stages/lib/ttsnorm.py load_dict 读取）
#
# {写法: 读法}。匹配规则：长键优先、大小写不敏感；ASCII 键按字母数字边界
# 匹配（API 命中"调API"但不吃 GraphAPI 子串）；数字结尾的键连 "." 也挡
#（"Qwen3" 不吃 "Qwen3.5"）。键==值 的条目 loader 会跳过——见文末"保持英文"
# 段，留着是为了错读时直接改值，不用再想键怎么写。
#
# 注意时序：词典替换发生在"字母-数字连字符拆分"之后（GPT-6→GPT6→GPT六，
# 回归锁死），所以带数字连字符的整词键（如 "GPT-6"）永远命中不了——
# 要写就写拆分后的形态或干脆让规则兜底。纯字母复合词的连字符保留，
# "SWE-bench" 这类键有效。
#
# 维护：抽听发现错读 → 加一行 → 重跑 `just voice`（text_sha 变了自动重合成
#       对应 seg，其余复用 61_audio 缓存）。

